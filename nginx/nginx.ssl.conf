worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/snippets/http-common.conf;

    map $scheme $forwarded_proto {
        default $scheme;
    }

    ssl_certificate     /etc/letsencrypt/live/inkofbaphomet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inkofbaphomet.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 80 default_server;
        server_name inkofbaphomet.com www.inkofbaphomet.com _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://inkofbaphomet.com$request_uri; }
    }

    # https://www -> https://apex
    server {
        listen 443 ssl;
        http2 on;
        server_name www.inkofbaphomet.com;
        return 301 https://inkofbaphomet.com$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name inkofbaphomet.com;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        include /etc/nginx/snippets/app-locations.conf;
    }
}
